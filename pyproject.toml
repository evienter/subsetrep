[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evienter-subsetrep"
version = "0.1.0"
description = "按段落统计评测子集的代表性相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "evienter" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://evienter.github.io"
Repository = "https://github.com/evienter/subsetrep"
Issues = "https://github.com/evienter/subsetrep/issues"

[project.scripts]
subsetrep = "subsetrep:main"

[tool.setuptools]
py-modules = ["subsetrep"]
